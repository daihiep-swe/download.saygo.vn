<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f7f2" />
    <link rel="icon" href="/icon.png" type="image/png" />
    <script>
      if (
        location.protocol === "http:" &&
        !["localhost", "127.0.0.1"].includes(location.hostname)
      ) {
        location.replace(
          `https://${location.host}${location.pathname}${location.search}${location.hash}`,
        );
      }
    </script>
    <title>SayGo: Ăn ngon, tiết kiệm</title>
    <meta
      name="description"
      content="Tải ứng dụng SayGo để khám phá ưu đãi ăn ngon và tiết kiệm mỗi ngày."
    />
    <link rel="canonical" href="https://download.saygo.vn/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SayGo" />
    <meta property="og:title" content="SayGo: Ăn ngon, tiết kiệm" />
    <meta
      property="og:description"
      content="Tải ứng dụng SayGo để khám phá ưu đãi ăn ngon và tiết kiệm mỗi ngày."
    />
    <meta property="og:url" content="https://download.saygo.vn/" />
    <meta
      property="og:image"
      content="https://download.saygo.vn/2220293f-2a8f-4de1-b2cd-d5d4b7ce69e7.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1731" />
    <meta property="og:image:height" content="909" />
    <meta property="og:image:alt" content="SayGo: Ăn ngon, tiết kiệm" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SayGo: Ăn ngon, tiết kiệm" />
    <meta
      name="twitter:description"
      content="Tải ứng dụng SayGo để khám phá ưu đãi ăn ngon và tiết kiệm mỗi ngày."
    />
    <meta
      name="twitter:image"
      content="https://download.saygo.vn/2220293f-2a8f-4de1-b2cd-d5d4b7ce69e7.png"
    />
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #17352a;
        background: #f4f7f2;
      }
      main {
        width: min(100%, 440px);
        text-align: center;
      }
      .mark {
        display: block;
        width: 76px;
        height: 76px;
        margin: 0 auto 22px;
        border-radius: 22px;
        object-fit: cover;
        box-shadow: 0 12px 28px rgb(29 124 80 / 22%);
      }
      h1 {
        margin: 0;
        font-size: clamp(28px, 8vw, 38px);
        line-height: 1.1;
        letter-spacing: 0;
      }
      p {
        margin: 14px 0 30px;
        color: #587065;
        line-height: 1.55;
      }
      .status {
        min-height: 24px;
        margin-bottom: 16px;
        font-size: 14px;
        color: #587065;
      }
      .stores {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        align-items: center;
        gap: 12px;
      }
      a {
        display: block;
        min-width: 0;
        border-radius: 8px;
        text-decoration: none;
        transition:
          transform 0.15s ease,
          box-shadow 0.15s ease;
      }
      a:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 18px rgb(23 53 42 / 12%);
      }
      .stores a {
        height: min(72px, calc((100vw - 60px) / 5.95));
        overflow: hidden;
      }
      .store-badge {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: fill;
      }
      .web-order {
        height: min(72px, calc((100vw - 60px) / 5.95));
        margin-top: 12px;
        display: grid;
        place-items: center;
        color: #002795;
        font-weight: 700;
        background: #ffd154;
      }
      .web-order:hover {
        background: #f5c43a;
      }
      footer {
        margin-top: 28px;
        font-size: 12px;
        color: #84968d;
      }
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="./icon.png" alt="SayGo" width="76" height="76" />
      <h1>Tải ứng dụng SayGo</h1>
      <p id="message">Đang xác định thiết bị của bạn...</p>
      <div class="status" id="status" aria-live="polite"></div>
      <div class="stores">
        <a
          href="https://apps.apple.com/vn/app/saygo-%C4%83n-ngon-ti%E1%BA%BFt-ki%E1%BB%87m/id6748329632"
          aria-label="Tải SayGo trên App Store"
        >
          <img
            class="store-badge"
            src="./app-store.png"
            alt="Tải trên App Store"
            width="236"
            height="79"
          />
        </a>
        <a
          href="https://play.google.com/store/apps/details?id=vn.saygo"
          aria-label="Tải SayGo trên Google Play"
        >
          <img
            class="store-badge"
            src="./google-play.png"
            alt="Tải trên Google Play"
            width="234"
            height="79"
          />
        </a>
      </div>
      <a class="web-order" href="https://food.saygo.vn"
        >ĐẶT NHANH BẰNG MÁY TÍNH</a
      >
      <footer>SayGo · Ăn ngon, tiết kiệm</footer>
    </main>
    <script>
      const stores = {
        ios: "https://apps.apple.com/vn/app/saygo-%C4%83n-ngon-ti%E1%BA%BFt-ki%E1%BB%87m/id6748329632",
        android: "https://play.google.com/store/apps/details?id=vn.saygo",
      };
      const ua = navigator.userAgent || navigator.vendor || "";
      const isIOS =
        /iPad|iPhone|iPod/.test(ua) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      const isAndroid = /Android/i.test(ua);
      const target = isIOS ? stores.ios : isAndroid ? stores.android : null;
      const label = isIOS
        ? "iPhone/iPad"
        : isAndroid
          ? "Android"
          : "thiết bị của bạn";
      document.getElementById("message").textContent = target
        ? `Đang chuyển bạn đến nơi tải app cho ${label}.`
        : "Chọn hệ điều hành để tải ứng dụng SayGo.";
      if (target) {
        document.getElementById("status").textContent =
          "Nếu không tự chuyển, hãy chọn nút bên dưới.";
        window.setTimeout(() => {
          window.location.href = target;
        }, 700);
      }
    </script>
  </body>
</html>
