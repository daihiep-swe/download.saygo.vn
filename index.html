  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #17352a; background: #f4f7f2; }
    main { width: min(100%, 440px); text-align: center; }
    .mark { width: 76px; height: 76px; margin: 0 auto 22px; border-radius: 22px; display: grid; place-items: center; color: white; font-size: 34px; font-weight: 800; background: #1d7c50; box-shadow: 0 12px 28px rgb(29 124 80 / 22%); }
    h1 { margin: 0; font-size: clamp(28px, 8vw, 38px); line-height: 1.1; letter-spacing: 0; }
    p { margin: 14px 0 30px; color: #587065; line-height: 1.55; }
    .status { min-height: 24px; margin-bottom: 16px; font-size: 14px; color: #587065; }
    .stores { display: grid; gap: 12px; }
    a { min-height: 54px; display: flex; align-items: center; justify-content: center; gap: 10px; border-radius: 8px; font-weight: 700; text-decoration: none; transition: transform .15s ease, box-shadow .15s ease; }
    a:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgb(23 53 42 / 12%); }
    .apple { color: white; background: #17352a; }
    .android { color: #17352a; background: #d7eadc; }
    .icon { width: 22px; height: 22px; display: inline-grid; place-items: center; font-size: 19px; }
    footer { margin-top: 28px; font-size: 12px; color: #84968d; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">S</div>
    <h1>Tải ứng dụng SayGo</h1>
    <p id="message">Đang xác định thiết bị của bạn...</p>
    <div class="status" id="status" aria-live="polite"></div>
    <div class="stores">
      <a class="apple" href="https://apps.apple.com/vn/app/saygo-%C4%83n-ngon-ti%E1%BA%BFt-ki%E1%BB%87m/id6748329632"><span class="icon"></span> Tải trên App Store</a>
      <a class="android" href="https://play.google.com/store/apps/details?id=vn.saygo"><span class="icon">▶</span> Tải trên Google Play</a>
    </div>
    <footer>SayGo · Ăn ngon, tiết kiệm</footer>
  </main>
  <script>
    const stores = {
      ios: 'https://apps.apple.com/vn/app/saygo-%C4%83n-ngon-ti%E1%BA%BFt-ki%E1%BB%87m/id6748329632',
      android: 'https://play.google.com/store/apps/details?id=vn.saygo'
    };
    const ua = navigator.userAgent || navigator.vendor || '';
    const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const isAndroid = /Android/i.test(ua);
    const target = isIOS ? stores.ios : isAndroid ? stores.android : null;
    const label = isIOS ? 'iPhone/iPad' : isAndroid ? 'Android' : 'thiết bị của bạn';
    document.getElementById('message').textContent = target ? `Đang chuyển bạn đến nơi tải app cho ${label}.` : 'Chọn hệ điều hành để tải ứng dụng SayGo.';
    if (target) {
      document.getElementById('status').textContent = 'Nếu không tự chuyển, hãy chọn nút bên dưới.';
      window.setTimeout(() => { window.location.href = target; }, 700);
    }
  </script>
</body>
</html>
